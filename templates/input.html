<!DOCTYPE html>
<html>
    <head> 
        <title>Bluesky Internship Searcher</title>
    </head>

    <body style="background-color:rgb(167, 190, 212);
                font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                text-align: center;">

        <h1 style="color: white;
                  margin-top: 50px;
                  font-size: 40px;">
            Bluesky Internships
        </h1>

        <form action="/output" method="POST">
            <input type="text" name="query" 
                   placeholder="Search Query..." 
                   style="width: 440px;
                          height: 20px;
                          border-radius: 10px;"/>
            <button type="submit"
                    style="border-radius: 10px;
                           height: 25px;
                           width: 70px;">
                Search
            </button>
        </form>

    </body>
</html>
